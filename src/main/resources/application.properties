spring.application.name=nayeogi

logging.level.com.ssafy=trace

# ===============================
# DATABASE & MYBATIS CONFIGURATION
# ===============================

# 1. MySQL Driver
# MySQL 8.0+ 드라이버 클래스 이름입니다.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Database URL
# 접속할 데이터베이스의 URL입니다. 'trip_dummy'는 실제 DB 이름입니다.
spring.datasource.url=jdbc:mysql://localhost:3306/trip_dummy?serverTimezone=UTC

# 3. Database Credentials
# [중요] 사용자의 로컬 MySQL 사용자 이름과 비밀번호로 반드시 변경해주세요.
spring.datasource.username=root
spring.datasource.password=6666

# 4. MyBatis Mapper-locations
# MyBatis가 SQL 쿼리가 담긴 XML 파일을 찾을 경로입니다.
mybatis.mapper-locations=classpath:mappers/**/*.xml

# 5. MyBatis Configuration
# DB의 snake_case 컬럼을 DTO의 camelCase 필드와 자동으로 매핑해주는 설정입니다.
mybatis.configuration.map-underscore-to-camel-case=true

# ===============================
# HikariCP Connection Pool (Optional)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=600000